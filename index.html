<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SocialTree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style1.css">
</head>
<body>

<div class="container">
  <h2>SocialTree </h2>
  
  <div class="card">

    <!-- LOGIN -->
     
    <form id="loginForm">
      <h2>Iniciar sesión</h2>
      <input type="text" id="loginUser" placeholder="Usuario" required>
      <input type="password" id="loginPass" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
      <p class="switch">
        ¿No tienes cuenta?
        <span onclick="mostrarRegistro()">Regístrate</span>
        
      </p>
    
    </form>

    <!-- REGISTRO -->
    <form id="registerForm" class="hidden">
      <h2>Crear cuenta</h2>
      <input type="text" id="regUser" placeholder="Usuario" required>
      <input type="email" id="regEmail" placeholder="Correo" required>
      <input type="password" id="regPass" placeholder="Contraseña" required>
      <button type="submit">Registrarse</button>
      <p class="switch">
        ¿Ya tienes cuenta?
        <span onclick="mostrarLogin()">Inicia sesión</span>
      </p>
    </form>

    <p id="mensaje"></p>

  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

<div id="g_id_onload"
     data-client_id="928212821558-ccr44piun88fs43v466r52jq1lamnmn4.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"></div>

<script>
function handleCredentialResponse(response) {
  console.log("TOKEN:", response.credential);
}
</script>

    <p>Versión DEMO</p>
</div>

<script defer src="./js/app.js"></script>
</body>
</html>
