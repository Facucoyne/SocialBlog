  </head>
  <body>
    <header class="primary-header | mb-2">
      <div class="container-lg">
        <nav class="navbar navbar-expand-lg bg-white">
          <div class="container-fluid">
           <h1>SocialTree</h1>
            <button
              class="navbar-toggler border-0"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
              <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item me-2">
                  <a class="nav-link" aria-current="page" href="index.html">Login</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Register</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <div
      id="response-message"
      class="response-message | alert alert-dismissible d-none d-flex align-items-center position-absolute top-0 end-0"
      role="alert"
    >
      <i id="response-icon" class="fa-solid me-2"></i>
      <div class="me-2" id="response-text">Dummy Text</div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <main>
      <div class="container">
        <div class="welcome | text-center mt-5">
          <img src="./images/Arbol1.png" alt="">
          <h1 class="heading">Bienvenidos</h1>
          <p class="text">Estas usando una version Demo  </p>
        </div>
        <div class="login | card mx-auto">
          <div class="card-body">
            <form class="p-3 needs-validation" novalidate id="login-form">
              <div class="mb-3">
              
              <div class="mb-3 form-check">
                
               
              </div>
              <button type="submit" class="login-submit | btn btn-primary">
                <a class="submit-text" href="./index2.html">Ingresar</a>
                <div
                  class="login-button-loader | d-none spinner-border spinner-border-sm"
                  role="status"
                >
                  <span class="visually-hidden">Loading...</span>
                </div>
              </button>
            </form>
          </div>
        </div>
        <div class="no-account | text-center mt-4">
          
        </div>
      </div>
    </main>

    <script src="js/login.js" type="module"></script>
  </body>
</html>
